name: Sidecar Images (GHCR)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "deploy/services/**"
      - ".github/workflows/sidecar-images.yml"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-sidecars:
    name: Build ${{ matrix.service }} sidecar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - docling
          - tesseract
          - rapidocr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/firecortex-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch sidecar image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/services/${{ matrix.service }}
          file: ./deploy/services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
