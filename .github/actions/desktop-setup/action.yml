name: Desktop build setup
description: Restore target-specific Rust/Node toolchains and caches, and consume the shared frontend artifact.

inputs:
  target:
    description: Rust target triple; isolates per-target Rust caches.
    required: true
  source-sha:
    description: Immutable source commit verified against the checked-out HEAD.
    required: true

runs:
  using: composite
  steps:
    - name: Verify source commit
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: node apps/desktop/scripts/desktop-source.mjs
    - uses: pnpm/action-setup@v5
      with:
        version: 10.17.0
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.99.1
        targets: ${{ inputs.target }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri
        shared-key: desktop-release-${{ inputs.target }}
    - name: Install desktop CLI
      shell: bash
      run: pnpm --filter @firecortex/desktop install --frozen-lockfile
    - name: Download frontend
      uses: actions/download-artifact@v7
      with:
        name: desktop-web
        path: apps/web/out
    - name: Check frontend export
      shell: bash
      run: test -f apps/web/out/index.html
