name: firecortex

services:
  app:
    image: ${FIRECORTEX_IMAGE:-ghcr.io/lieyanc/firecortex:latest}
    container_name: firecortex-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Full compose connects to bundled services on the compose network.
      # These environment variables override database and Redis values in config.yaml.
      POSTGRES_DSN: "postgres://firecortex:firecortex_2026@postgres:5432/firecortex?sslmode=disable&TimeZone=Asia/Shanghai"
      REDIS_ADDR: "redis:6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: "firecortex_2026"
    ports:
      # Optional. Localhost-only by default. Put a reverse proxy in front for public access.
      - "127.0.0.1:8080:8080"
    volumes:
      - app_storage:/app/storage
      - app_data:/app/data
      # The image runs from /app and reads /app/config.yaml automatically.
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - firecortex

  postgres:
    image: pgvector/pgvector:pg16
    container_name: firecortex-postgres
    environment:
      POSTGRES_USER: firecortex
      POSTGRES_PASSWORD: firecortex_2026
      POSTGRES_DB: firecortex
    ports:
      # Optional. Localhost-only for local administration; the app uses the internal Docker network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - firecortex

  redis:
    image: redis:7
    container_name: firecortex-redis
    command: redis-server --requirepass firecortex_2026
    ports:
      # Optional. Localhost-only for local administration; the app uses the internal Docker network.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "firecortex_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - firecortex

volumes:
  app_storage:
    name: firecortex-app-storage
  app_data:
    name: firecortex-app-data
  postgres_data:
    name: firecortex-postgres-data
  redis_data:
    name: firecortex-redis-data

networks:
  firecortex:
    name: firecortex-network
