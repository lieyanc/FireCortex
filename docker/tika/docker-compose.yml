services:
  tika:
    image: apache/tika:3.2.3.0
    container_name: firecortex-tika
    ports:
      # Optional. Localhost-only by default. FireCortex on the same host reaches it at http://127.0.0.1:9998.
      - "127.0.0.1:9998:9998"
    restart: unless-stopped
    networks:
      - firecortex

networks:
  firecortex:
    # Required. Create it once with: docker network create firecortex-network
    external: true
    name: firecortex-network
