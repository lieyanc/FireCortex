services:
  docling:
    container_name: firecortex-docling
    image: firecortex-docling:latest
    build:
      context: ../../
      dockerfile: docker/docling/Dockerfile
    ports:
      # Optional. Localhost-only by default. FireCortex on the same host reaches it at http://127.0.0.1:8005/ocr.
      - "127.0.0.1:8005:8005"
    restart: unless-stopped
    networks:
      - firecortex

networks:
  firecortex:
    # Required. Create it once with: docker network create firecortex-network
    external: true
    name: firecortex-network
