services:
  tesseract:
    container_name: firecortex-tesseract
    image: firecortex-tesseract:latest
    build:
      context: ../../
      dockerfile: docker/tesseract/Dockerfile
    ports:
      # Optional. Localhost-only by default. FireCortex on the same host reaches it at http://127.0.0.1:8004/ocr.
      - "127.0.0.1:8004:8004"
    environment:
      TESSERACT_LANG: ${TESSERACT_LANG:-chi_sim+eng}
      TESSERACT_PSM: ${TESSERACT_PSM:-3}
      TESSERACT_OEM: ${TESSERACT_OEM:-3}
      TESSERACT_RENDER_SCALE: ${TESSERACT_RENDER_SCALE:-2.0}
      TESSERACT_GRAYSCALE: ${TESSERACT_GRAYSCALE:-true}
    restart: unless-stopped
    networks:
      - firecortex

networks:
  firecortex:
    # Required. Create it once with: docker network create firecortex-network
    external: true
    name: firecortex-network
